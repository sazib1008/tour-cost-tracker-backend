version: '3.8'

services:
  tripzy-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripzy-backend
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-2592000000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped

  # Optional local MongoDB fallback (uncomment if using local offline db)
