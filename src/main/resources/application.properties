spring.application.name=tripzy_backend
server.port=8080

# MongoDB Configuration (Atlas)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:tripzy-default-super-secret-key-that-must-be-at-least-256-bits-long-for-hmac-sha256}
app.jwt.expiration-ms=2592000000

# Google OAuth2
app.google.client-id=${GOOGLE_CLIENT_ID:17160265661-kqeqo57434ck37vsfv9v0ovp0375klui.apps.googleusercontent.com}

# Logging
logging.level.com.example.tripzy_backend=DEBUG
