

spring.application.name=tripzy_backend
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Google OAuth2
app.google.client-id=${GOOGLE_CLIENT_ID}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Logging
logging.level.com.example.tripzy_backend=${LOG_LEVEL:INFO}