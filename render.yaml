services:
  - type: web
    name: tripzy-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 2592000000
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
